<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экстракционный узел IBSimu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="stage">
  <div id="viewport"></div>
  <svg class="leaders" aria-hidden="true"></svg>
  <div class="callouts"></div>

  <header id="title">
    <div class="eyebrow">Дипломный проект · моделирование в IBSimu</div>
    <h1>Экстракционный узел ионного источника</h1>
    <p>Параметризация электродов и численное моделирование ионного пучка</p>
  </header>

  <header id="heading">
    <div class="eyebrow"></div>
    <h2></h2>
    <p></p>
  </header>

  <!-- Автор: впишите свои данные здесь -->
  <footer id="credits">
    <div class="credit"><span>Выполнил</span><b>Белоусов Владислав, группа 23353</b></div>
  </footer>

  <nav id="hud" aria-label="Управление презентацией">
    <span id="scene-label"></span>
    <button id="prev" title="Предыдущая сцена (←)" aria-label="Предыдущая сцена">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="restart" title="Перезапустить анимацию (R)" aria-label="Перезапустить">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg></button>
    <button id="play" class="primary" title="Пауза (пробел)" aria-label="Воспроизвести или пауза">
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
    <button id="next" title="Следующая сцена (→)" aria-label="Следующая сцена">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button id="fullscreen" title="Полный экран (F)" aria-label="Полный экран">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <span id="scene-count"></span>
  </nav>

  <div id="loading">Загрузка геометрии…</div>
</main>

<script src="vendor/three.min.js"></script>
<script src="data/geometry.js"></script>
<script src="js/engine.js"></script>
<script src="js/overlay.js"></script>
<script src="js/scenes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
